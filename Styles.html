<style>
  :root {
    --ink: #20243d;
    --muted: #74798f;
    --paper: #ffffff;
    --canvas: #f3f4f8;
    --line: #e4e5ed;
    --primary: #252b4a;
    --accent: #6e5de7;
    --accent-soft: #eeeafd;
    --mint: #b7f0d4;
    --danger: #b64242;
    --shadow: 0 18px 45px rgba(32, 36, 61, 0.08);
  }

  * {
    box-sizing: border-box;
  }

  html {
    min-height: 100%;
    background: var(--canvas);
  }

  body {
    min-width: 320px;
    min-height: 100vh;
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(circle at 90% 8%, rgba(110, 93, 231, 0.09), transparent 25rem),
      var(--canvas);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  button,
  input,
  textarea,
  select {
    font: inherit;
  }

  button {
    cursor: pointer;
  }

  .is-hidden {
    display: none !important;
  }

  .app-shell {
    display: grid;
    grid-template-columns: 250px minmax(0, 1fr);
    min-height: 100vh;
  }

  .sidebar {
    position: sticky;
    top: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: 32px 24px 24px;
    color: #fff;
    background: var(--primary);
  }

  .brand {
    display: flex;
    gap: 12px;
    align-items: center;
    color: #fff;
    font-size: 1.2rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    text-decoration: none;
  }

  .brand-mark {
    display: grid;
    width: 38px;
    height: 38px;
    place-items: center;
    color: var(--primary);
    border-radius: 12px;
    background: var(--mint);
  }

  .main-nav {
    display: grid;
    gap: 8px;
    margin-top: 56px;
  }

  .nav-item {
    display: flex;
    gap: 14px;
    align-items: center;
    width: 100%;
    padding: 13px 14px;
    color: #c9ccda;
    border: 0;
    border-radius: 12px;
    background: transparent;
    text-align: left;
  }

  .nav-item:hover,
  .nav-item:focus-visible,
  .nav-item.is-active {
    color: #fff;
    outline: none;
    background: rgba(255, 255, 255, 0.1);
  }

  .nav-icon {
    color: var(--mint);
    font-size: 0.68rem;
    font-weight: 800;
    letter-spacing: 0.08em;
  }

  .sidebar-note {
    margin-top: auto;
    padding: 18px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.06);
  }

  .sidebar-note p {
    margin: 8px 0 0;
    color: #d7d9e4;
    font-size: 0.82rem;
    line-height: 1.5;
  }

  .main-content {
    width: min(1180px, 100%);
    margin: 0 auto;
    padding: 34px 42px 56px;
  }

  .topbar,
  .panel-heading,
  .modal-heading,
  .form-actions {
    display: flex;
    justify-content: space-between;
    gap: 24px;
    align-items: center;
  }

  .topbar {
    align-items: flex-start;
  }

  .page-heading {
    min-width: 0;
  }

  .page-description {
    max-width: 680px;
    margin: 10px 0 0;
    color: var(--muted);
    line-height: 1.55;
  }

  h1,
  h2,
  p {
    margin-top: 0;
  }

  h1 {
    margin-bottom: 0;
    font-size: clamp(1.6rem, 3vw, 2.35rem);
    line-height: 1.08;
    letter-spacing: -0.045em;
  }

  h2 {
    margin-bottom: 0;
    font-size: 1.25rem;
    letter-spacing: -0.025em;
  }

  .eyebrow {
    margin-bottom: 7px;
    color: var(--accent);
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .eyebrow.light {
    color: var(--mint);
  }

  .user-chip {
    display: flex;
    gap: 11px;
    align-items: center;
    min-width: 170px;
  }

  .avatar {
    display: grid;
    width: 42px;
    height: 42px;
    flex: 0 0 auto;
    place-items: center;
    color: #fff;
    border-radius: 50%;
    background: var(--accent);
    font-weight: 800;
  }

  .user-copy {
    display: grid;
    min-width: 0;
  }

  .user-copy strong,
  .user-copy small {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .user-copy strong {
    overflow-wrap: anywhere;
  }

  .user-copy small {
    color: var(--muted);
    margin-top: 2px;
  }

  .hero-panel {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 28px;
    margin-top: 34px;
    padding: 34px;
    color: #fff;
    border-radius: 24px;
    background:
      linear-gradient(120deg, rgba(255, 255, 255, 0.04), rgba(110, 93, 231, 0.26)),
      var(--primary);
    box-shadow: var(--shadow);
  }

  .hero-panel h2 {
    font-size: clamp(1.7rem, 4vw, 2.65rem);
  }

  .hero-panel p:last-child {
    max-width: 620px;
    margin: 12px 0 0;
    color: #d8dae5;
    line-height: 1.55;
  }

  .primary-button,
  .secondary-button,
  .text-button,
  .icon-button {
    border: 0;
    border-radius: 12px;
    font-weight: 750;
  }

  .secondary-light-button,
  .back-button,
  .compact-button {
    border: 0;
    border-radius: 10px;
    font-weight: 750;
  }

  .secondary-light-button {
    padding: 12px 16px;
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.24);
    background: rgba(255, 255, 255, 0.08);
  }

  .back-button {
    margin-top: 30px;
    padding: 9px 0;
    color: var(--accent);
    background: transparent;
  }

  .compact-button {
    padding: 9px 12px;
    color: var(--accent);
    background: var(--accent-soft);
    white-space: nowrap;
  }

  .primary-button {
    padding: 12px 18px;
    color: var(--primary);
    background: var(--mint);
  }

  .primary-button:hover,
  .primary-button:focus-visible {
    outline: 3px solid rgba(183, 240, 212, 0.28);
    transform: translateY(-1px);
  }

  .primary-button:disabled {
    cursor: wait;
    opacity: 0.65;
    transform: none;
  }

  .secondary-button {
    padding: 12px 18px;
    color: var(--ink);
    background: var(--canvas);
  }

  .text-button,
  .icon-button {
    color: var(--accent);
    background: transparent;
  }

  .icon-button {
    width: 38px;
    height: 38px;
    color: var(--muted);
    font-size: 1.5rem;
  }

  .metric-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
    margin-top: 20px;
  }

  .metric-card,
  .panel {
    border: 1px solid var(--line);
    background: var(--paper);
    box-shadow: 0 8px 24px rgba(32, 36, 61, 0.04);
  }

  .metric-card {
    display: grid;
    min-height: 144px;
    padding: 22px;
    border-radius: 18px;
  }

  .metric-card.accent-card {
    border-color: #d9d2fb;
    background: var(--accent-soft);
  }

  .metric-label {
    color: var(--muted);
    font-size: 0.82rem;
    font-weight: 700;
  }

  .metric-card strong {
    align-self: end;
    font-size: 2.35rem;
    line-height: 1;
  }

  .metric-card small {
    margin-top: 8px;
    color: var(--muted);
  }

  .content-grid {
    display: grid;
    grid-template-columns: 1.25fr 1fr;
    gap: 20px;
    margin-top: 20px;
  }

  .panel {
    min-width: 0;
    padding: 24px;
    border-radius: 20px;
  }

  .panel-heading {
    margin-bottom: 20px;
  }

  .stack-list {
    display: grid;
    gap: 11px;
  }

  .list-item {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 14px;
    align-items: center;
    padding: 15px;
    border: 1px solid var(--line);
    border-radius: 14px;
  }

  .list-item h3 {
    margin: 0 0 5px;
    overflow: hidden;
    font-size: 0.94rem;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .list-button {
    width: 100%;
    color: inherit;
    background: #fff;
    text-align: left;
  }

  .list-button:hover,
  .list-button:focus-visible {
    border-color: #bdb5ef;
    outline: none;
    box-shadow: 0 6px 18px rgba(50, 45, 90, 0.07);
  }

  .list-button > span:first-child,
  .contribution-mini > div {
    display: grid;
    min-width: 0;
    gap: 5px;
  }

  .list-button small,
  .contribution-mini small {
    overflow: hidden;
    color: var(--muted);
    font-size: 0.78rem;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .list-item p {
    margin: 0;
    color: var(--muted);
    font-size: 0.8rem;
  }

  .status {
    padding: 7px 10px;
    color: #345b48;
    border-radius: 999px;
    background: #e2f7ec;
    font-size: 0.72rem;
    font-weight: 800;
  }

  .status.closed {
    color: #6d667b;
    background: #eceaf0;
  }

  .status-pendiente,
  .status-activo {
    color: #345b48;
    background: #e2f7ec;
  }

  .status-entregado {
    color: #493e91;
    background: #e9e5ff;
  }

  .status-observado {
    color: #8b4a22;
    background: #fff0df;
  }

  .status-reportada {
    color: #80531e;
    background: #fff1cf;
  }

  .status-confirmada {
    color: #8b4a22;
    background: #ffe7d5;
  }

  .status-resuelta {
    color: #345b48;
    background: #e2f7ec;
  }

  .status-descartada {
    color: #6d667b;
    background: #eceaf0;
  }

  .status-culminada,
  .status-inactivo {
    color: #6d667b;
    background: #eceaf0;
  }

  .contribution-mini {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 12px;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }

  .contribution-mini:last-child {
    border-bottom: 0;
  }

  .section-toolbar {
    display: flex;
    justify-content: space-between;
    gap: 28px;
    align-items: flex-end;
    margin-top: 38px;
  }

  .section-controls {
    justify-content: flex-end;
    align-items: center;
    min-height: 45px;
  }

  .page-intro h2 {
    font-size: clamp(1.7rem, 4vw, 2.5rem);
  }

  .page-intro > p:last-child {
    max-width: 620px;
    margin: 10px 0 0;
    color: var(--muted);
    line-height: 1.55;
  }

  .activity-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
    margin-top: 26px;
  }

  .activity-card {
    display: grid;
    min-height: 270px;
    padding: 24px;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: #fff;
    box-shadow: 0 8px 24px rgba(32, 36, 61, 0.04);
  }

  .activity-card-top,
  .activity-footer,
  .detail-kicker,
  .contribution-title,
  .valuation-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .activity-card-top > span:last-child,
  .detail-kicker > span:last-child,
  .contribution-title > span:first-child {
    color: var(--muted);
    font-size: 0.74rem;
    font-weight: 800;
    letter-spacing: 0.06em;
  }

  .activity-card h3 {
    margin: 24px 0 10px;
    font-size: 1.35rem;
    letter-spacing: -0.025em;
  }

  .activity-card > p {
    color: var(--muted);
    line-height: 1.55;
  }

  .activity-stats {
    display: flex;
    gap: 22px;
    margin-top: auto;
    padding: 18px 0;
    color: var(--muted);
    border-top: 1px solid var(--line);
    font-size: 0.8rem;
  }

  .activity-stats strong {
    color: var(--ink);
  }

  .activity-footer small {
    color: var(--muted);
  }

  .detail-hero {
    display: flex;
    justify-content: space-between;
    gap: 30px;
    align-items: flex-end;
    margin-top: 10px;
    padding: 32px;
    color: #fff;
    border-radius: 24px;
    background: var(--primary);
  }

  .detail-hero h2 {
    margin-top: 20px;
    font-size: clamp(1.7rem, 4vw, 2.5rem);
  }

  .detail-hero p {
    max-width: 650px;
    margin: 10px 0 14px;
    color: #d8dae5;
    line-height: 1.55;
  }

  .detail-hero > div:first-child > small {
    color: #bfc2d2;
  }

  .detail-actions {
    display: flex;
    gap: 10px;
    flex: 0 0 auto;
  }

  .detail-grid {
    display: grid;
    grid-template-columns: minmax(260px, 0.72fr) minmax(0, 1.28fr);
    gap: 20px;
    margin-top: 20px;
  }

  .panel-heading h3 {
    margin: 0;
    font-size: 1.15rem;
  }

  .count-chip,
  .type-chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 30px;
    min-height: 30px;
    padding: 6px 9px;
    color: var(--accent);
    border-radius: 999px;
    background: var(--accent-soft);
    font-size: 0.72rem;
    font-weight: 800;
  }

  .card-stack {
    display: grid;
    gap: 12px;
  }

  .deliverable-card,
  .contribution-card {
    border: 1px solid var(--line);
    border-radius: 14px;
    background: #fff;
  }

  .card-actions {
    display: grid;
    gap: 7px;
    align-content: center;
  }

  .warning-button {
    color: #8b4a22;
    background: #fff0df;
  }

  .deliverable-card {
    padding: 16px;
  }

  .deliverable-card h4,
  .contribution-card h4 {
    margin: 10px 0 6px;
  }

  .deliverable-card p,
  .deliverable-card small,
  .contribution-card p {
    color: var(--muted);
    font-size: 0.8rem;
    line-height: 1.45;
  }

  .deliverable-card a,
  .evidence-links a {
    color: var(--accent);
    font-size: 0.78rem;
    font-weight: 750;
  }

  .contribution-card {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 14px;
    align-items: center;
    padding: 17px;
  }

  .valuation-line {
    justify-content: flex-start;
    flex-wrap: wrap;
    margin-top: 12px;
  }

  .valuation-line small {
    color: var(--muted);
  }

  .evidence-links {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 12px;
  }

  .observation-stack {
    display: grid;
    gap: 8px;
    margin-top: 12px;
  }

  .observation-item {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    padding: 10px 12px;
    border-left: 3px solid #e0a25c;
    border-radius: 8px;
    background: #fff8ef;
  }

  .observation-item p {
    margin: 4px 0 0;
    color: var(--ink);
  }

  .observation-meta {
    color: #8b4a22;
    font-size: 0.7rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .history-panel {
    margin-top: 20px;
  }

  .timeline {
    display: grid;
    gap: 0;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .timeline li:not(.empty-inline) {
    position: relative;
    display: grid;
    grid-template-columns: 16px minmax(0, 1fr);
    gap: 12px;
    padding: 10px 0;
  }

  .timeline li:not(.empty-inline)::before {
    position: absolute;
    top: 25px;
    bottom: -10px;
    left: 5px;
    width: 2px;
    content: "";
    background: var(--line);
  }

  .timeline li:last-child::before {
    display: none;
  }

  .timeline-dot {
    z-index: 1;
    width: 12px;
    height: 12px;
    margin-top: 4px;
    border: 3px solid #ded8ff;
    border-radius: 50%;
    background: var(--accent);
  }

  .timeline p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 0.78rem;
  }

  .timeline-detail {
    display: block;
    margin-top: 4px;
    color: #4f5570;
    font-size: 0.78rem;
    line-height: 1.45;
    overflow-wrap: anywhere;
  }

  .evidence-links a,
  .evidence-links span {
    padding: 5px 8px;
    border-radius: 8px;
    background: var(--canvas);
  }

  .compact-stage {
    max-width: 680px;
  }

  .table-panel {
    margin-top: 24px;
  }

  .compact-select {
    min-width: min(330px, 100%);
  }

  .results-content {
    margin-top: 24px;
  }

  .result-banner {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: center;
    padding: 14px 18px;
    color: #5e508e;
    border: 1px solid #d9d2fb;
    border-radius: 14px;
    background: var(--accent-soft);
    font-size: 0.82rem;
    font-weight: 750;
  }

  .result-banner.final-result {
    color: #345b48;
    border-color: #bde6cf;
    background: #e5f8ed;
  }

  .result-cards {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
    margin-top: 18px;
  }

  .result-card {
    padding: 22px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: #fff;
    box-shadow: 0 8px 24px rgba(32, 36, 61, 0.04);
  }

  .result-person {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .result-person h3 {
    margin: 0 0 4px;
  }

  .result-person small {
    color: var(--muted);
  }

  .result-percentages {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin-top: 22px;
  }

  .result-percentages > div {
    display: grid;
    gap: 6px;
  }

  .result-percentages strong {
    font-size: 1.7rem;
    letter-spacing: -0.04em;
  }

  .result-percentages span {
    color: var(--muted);
    font-size: 0.72rem;
  }

  .progress-track {
    height: 7px;
    margin-top: 20px;
    overflow: hidden;
    border-radius: 99px;
    background: var(--canvas);
  }

  .progress-track span {
    display: block;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--accent), #8f83ef);
  }

  .result-explanation {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
    margin-top: 18px;
  }

  .result-explanation > div {
    padding: 18px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.7);
  }

  .result-explanation p {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 0.82rem;
    line-height: 1.5;
  }

  .table-wrap {
    overflow-x: auto;
  }

  .team-table {
    width: 100%;
    min-width: 620px;
    border-collapse: collapse;
  }

  .team-table th,
  .team-table td {
    padding: 14px 12px;
    border-bottom: 1px solid var(--line);
    text-align: left;
  }

  .team-table th {
    color: var(--muted);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .team-table tr:last-child td {
    border-bottom: 0;
  }

  .member-cell {
    display: flex;
    gap: 11px;
    align-items: center;
  }

  .member-cell > span:last-child {
    display: grid;
    gap: 3px;
  }

  .member-cell small {
    color: var(--muted);
    overflow-wrap: anywhere;
  }

  .small-avatar {
    width: 36px;
    height: 36px;
    font-size: 0.75rem;
  }

  .empty-inline {
    padding: 26px 16px;
    color: var(--muted);
    border: 1px dashed #cfd1dc;
    border-radius: 14px;
    text-align: center;
    line-height: 1.5;
  }

  .empty-stage {
    max-width: 720px;
    margin: 90px auto;
    padding: 46px;
    border: 1px solid var(--line);
    border-radius: 24px;
    background: var(--paper);
    box-shadow: var(--shadow);
    text-align: center;
  }

  .empty-stage h2 {
    margin-bottom: 14px;
    font-size: 1.8rem;
  }

  .empty-stage > p:last-child {
    margin-bottom: 0;
    color: var(--muted);
    line-height: 1.6;
  }

  .empty-number {
    display: inline-grid;
    width: 58px;
    height: 58px;
    margin-bottom: 20px;
    place-items: center;
    color: var(--accent);
    border-radius: 18px;
    background: var(--accent-soft);
    font-weight: 850;
